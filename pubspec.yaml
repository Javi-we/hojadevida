name: cv_flutter_wrapper
description: "Evolución de Hoja de Vida: De Nativo Android a Despliegue Web Embed en Flutter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.15.0
  webview_flutter_wkwebview: ^3.12.0
  url_launcher: ^6.2.5
  share_plus: ^8.0.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/web/
    - assets/web/index.html
    - assets/web/styles.css
    - assets/web/script.js
    - assets/web/profile_photo.jpg
